lname: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Extract project
        run: find . -name "*.zip" -exec unzip -o {} -d extracted \;

      - name: Build APK
        run: |
          PROJ=$(dirname "$(find extracted -name settings.gradle | head -1)")
          gradle -p "$PROJ" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RiseFit-APK
          path: |
            **/app-debug.apk
